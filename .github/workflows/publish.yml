name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify

      - name: Publish to npm with trusted publishing
        env:
          NODE_AUTH_TOKEN: ''
        run: npm publish --access public

      # npm can take minutes to serve a new version. Wait for exactly this version,
      # and scan it by version: an unpinned scan of "latest" silently checks the
      # previous release while the new one is still processing.
      - name: Wait for npm registry propagation
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 40); do
            [ "$(npm view "@deepidealab/n8n-nodes-tracira@$VERSION" version 2>/dev/null)" = "$VERSION" ] && exit 0
            sleep 15
          done
          echo "Version $VERSION not visible on npm after 10 minutes" && exit 1

      - name: Run package scan
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for attempt in 1 2 3 4 5; do
            npx @n8n/scan-community-package "@deepidealab/n8n-nodes-tracira@$VERSION" && exit 0
            sleep 20
          done
          exit 1
